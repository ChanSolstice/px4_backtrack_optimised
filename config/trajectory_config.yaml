# trajectory_core 轨迹生成库配置文件
# 基于: API接口文档.md
# 版本: 0.1.0
# 日期: 2026-01-30
# 说明: 简易YAML格式，每行一个 key: value

# ============================
# 采样与拟合参数
# ============================

# 弧长重采样间距 (m)
ds_m: 0.15

# 走廊约束半径 (m)
max_deviation_m: 0.15

# 内部时间采样步长 (s) - 20Hz
dt_sample_s: 0.05

# 去重点最小距离 (m)
min_point_dist_m: 0.01

# 时间间隙异常阈值 (s)
max_dt_gap_s: 0.5

# ============================
# 拐角处理参数
# ============================

# 拐角检测角度阈值 (deg) - 角度 >= 阈值判定为拐角
corner_angle_threshold_deg: 135.0

# 拐角过渡长度 (m)
corner_blend_len_m: 0.3

# 拐角混合比例（安全系数）
corner_blend_ratio: 0.4

# ============================
# Yaw 处理参数
# ============================

# 启用 yaw 平滑
enable_yaw_smooth: true

# 最大 yaw 偏差 (rad)
max_yaw_deviation_rad: 0.05

# 最大 yaw 角速度 (rad/s)
yaw_rate_max: 0.6

# yaw 约束影响速度
enable_yaw_rate_constraint_on_velocity: true

# ============================
# 末端收敛参数
# ============================

# 启用末端收敛
enable_end_converge: true

# 收敛触发弧长 (m)
s_stop_m: 3.0

# 收敛触发距离 (m)
r_stop_m: 2.0

# 收敛段最大速度 (m/s)
v_end_max: 0.8

# Yaw 保持距离 (m)
r_yaw_hold_m: 1.0

# ============================
# 速度与加速度约束
# ============================

# 最大水平速度 (m/s)
v_max: 2.0

# 最大竖直速度 (m/s)
vz_max: 0.8

# 最大切向加速度 (m/s²)
a_tan_max: 1.0

# 最大横向加速度 (m/s²)
a_lat_max: 1.0

# 最大上升加速度 (m/s²)
az_up_max: 1.0

# 最大下降加速度 (m/s²)
az_down_max: 1.0

# ============================
# 起止速度参数
# ============================

# 起始速度 (m/s)
v_start_m_s: 0.0

# 终止速度 (m/s)
v_end_m_s: 0.0

# ============================
# 输出选项
# ============================

# 启用加速度输出
enable_output_acc: false
