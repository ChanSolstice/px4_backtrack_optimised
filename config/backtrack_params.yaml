# 返航节点参数配置文件
# 依据：doc/design/返航触发与状态机重构方案.md 第 10 节。参数全部必填，代码中没有默认值。

# ============================
# 基础参数
# ============================

# 控制循环频率 (Hz)
publish_hz: 20.0

# ARM后延时录制时间 (s)
record_delay_s: 15.0

# 触发返航所需最少录制点数
record_min_points: 30

# 录制最大频率 (Hz) - 超过此频率的odom消息会被节流
record_max_hz: 15.0

# ============================
# 通道7参数（长按返航 / 短按退出）
# ============================

# 是否启用通道7
enable_trigger_ch7: true

# 通道7按下阈值（< 此值视为按下）；CH7 是两档按钮，1500 是中点
ch7_pressed_threshold: 1500

# 长按持续时间 (s) - 达到时请求返航
ch7_hold_s: 2.0

# 退出短按的最短按下时间 (s) - 按下 ≥ 此值且在 ch7_hold_s 前松开，松开时请求退出
ch7_exit_min_s: 0.3

# ============================
# 通道18触发参数（故障触发）
# ============================

# 是否启用通道18触发
enable_trigger_ch18: true

# 通道18故障阈值（< 此值视为失控）
ch18_failsafe_threshold: 900

# 漏桶确认阈值 (s) - 失控帧累计达到此值确认链路丢失，同时是漏桶上限
ch18_confirm_s: 1.0

# 漏桶每秒泄漏量 - 通道18正常时漏桶按此速率下降
link_loss_leak_rate: 0.2

# 固定点悬停等待时间 (s)
ch18_hover_wait_s: 15.0

# ============================
# RC消息丢失触发参数
# ============================

# 是否启用RC消息丢失触发
enable_trigger_rc_loss: true

# RC消息超时时间 (s) - 超过此时间未收到消息判定丢失
rc_loss_timeout_s: 0.15

# RC丢失防抖时间 (s) - 持续丢失超过此时间才触发
rc_loss_debounce_s: 0.1

# ============================
# 链路恢复与退化
# ============================

# 链路恢复所需的连续正常时间 (s)
link_recover_s: 2.0

# 退化判定窗口 (s) - 窗口内出现过失控帧或RC超时即为退化，此时不接受退出和外部切出
link_degraded_window_s: 5.0

# ============================
# 低电量触发参数
# ============================

# 是否启用低电量触发
enable_trigger_low_battery: true

# 低电量阈值 (0.0~1.0)，低于此值视为低电量（0.15 = 15%）
low_battery_threshold: 0.15

# 低电量确认时间 (s)，持续低于阈值超过此时间才触发
low_battery_confirm_s: 3.0

# ============================
# 输入新鲜度与在空中判定
# ============================

# 里程计延迟 (s) - 超过此时间未收到里程计时冻结并保持
odom_stale_s: 0.25

# 里程计中断 (s)
odom_timeout_s: 2.0

# 飞控状态中断 (s) - /mavros/state 心跳为 1 Hz
fcu_state_stale_s: 3.0

# 在空中判定：当前高度比解锁高度至少高出的距离 (m)
airborne_min_height_m: 0.5

# ============================
# 返航任务与控制权
# ============================

# 点数不足时最长等待补点 (s)，仍不足则原地降落
return_pending_max_s: 3.0

# 申请OFFBOARD前预发的setpoint帧数（6 帧 = 0.3 s）
pre_offboard_setpoint_count: 6

# 自身断流阈值 (s) - 回看窗口内相邻两次发布间隔 ≥ 此值时，被切出视为飞控回退
fallback_gap_s: 0.5

# 断流回看窗口 (s)
fallback_window_s: 3.0

# 飞控回退后等待自动回到OFFBOARD的上限 (s)
fallback_timeout_s: 3.0

# 安全距离 (m) - 不在录制轨迹上的直线移动上限（D30）：重新接入、开始跟随的偏差，
# 跟随中的偏离，以及录制轨迹相邻两点的间隔，超过时原地保持并告警，不直线飞过去
safe_distance_m: 1.0

# 降落交接中POSCTL未生效时改为直接请求AUTO.LAND (s)
handover_posctl_timeout_s: 3.0

# 模式请求的重发间隔 (s)
mode_request_interval_s: 1.0

# 模式请求的生效超时 (s) - 超时告警 MODE_REQUEST_FAILED
mode_request_timeout_s: 3.0

# ============================
# 后台规划
# ============================

# 规划告警时间 (s) - 提交后超过此时间仍未完成，告警 PLANNING_SLOW
planning_warn_s: 10.0

# 规划超时 (s) - 超过此时间丢弃结果，改为航点降级返航
planning_timeout_s: 30.0

# ============================
# 退出后新轨迹
# ============================

# 游标搜索窗口 (m) - 返航中定位已经走到哪个录制点，退出时把录制截断到这里
cursor_window_m: 2.0

# ============================
# 轨迹回归参数
# ============================

# 触发回归的偏离距离 (m)
rejoin_trigger_dist_m: 0.5

# 成功回到安全走廊的距离阈值 (m)，须小于触发距离
rejoin_success_dist_m: 0.4

# 回归时的最大速度 (m/s)
rejoin_v_max_m_s: 0.3

# 回归预瞄时间 (s)
rejoin_lookahead_time_s: 0.5

# 偏离持续超阈值多久后进入回归 (s)
rejoin_trigger_hold_s: 0.25

# 回归持续满足阈值多久后退出回归 (s)
rejoin_success_hold_s: 0.10

# ============================
# 降落过渡参数
# ============================

# 返航结束后的固定点悬停时间 (s)
landing_hover_s: 5.0

# ============================
# trajectory_core配置文件路径
# ============================

# 轨迹生成库配置文件路径（必填）
trajectory_config_path: "$(find px4_backtrack_optimised)/config/trajectory_config.yaml"

# ============================
# Debug/可视化参数
# ============================

# 是否启用CSV文件导出（轨迹生成成功后自动导出录制点和生成轨迹）
debug_enable_csv_dump: true

# CSV导出目录路径（留空则默认 ~/.ros/backtrack_debug/）
debug_csv_output_dir: ""

# 轨迹采样步长 (s) - 用于CSV导出和ROS可视化
debug_trajectory_sample_dt: 0.1

# 是否启用ROS可视化话题发布（录制航迹点+返航轨迹）
debug_enable_rviz_publish: true

# 是否写调试日志（每次启动一个运行目录，events.jsonl）；试飞期间建议打开
debug_log_enable: false

# 调试日志根目录；留空为 ~/.ros/backtrack_logs，非空必须是绝对路径
debug_log_dir: ""
